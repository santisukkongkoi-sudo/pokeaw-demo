<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ย้ายหน้าเว็บร้านแล้ว</title>
<!-- 3.1.2: วางแทน index.html ใน repo เดิม (pokeaw-demo) หลังเปลี่ยน LIFF Endpoint URL ไปที่ repo ใหม่แล้วเท่านั้น
     เปิดในเบราว์เซอร์ทั่วไป → พาไปหน้าใหม่ทันที (เก็บหน้าที่ตั้งใจเปิด เช่น ?page=bills) / เปิดในแอป LINE → ปุ่มเปิด MINI App ของร้าน
     ไฟล์นี้ไม่มี token รหัสลับ หรือข้อมูลลูกค้า -->
<style>
  :root { --bg: #f4f7f5; --card: #ffffff; --ink: #1f2d27; --muted: #5f7368; --green: #0e7c47; --line: #d5ddd8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111a16; --card: #1a2620; --ink: #e8efeb; --muted: #a7b8ae; --green: #3fbf7f; --line: #2c3b33; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
    font: 16px/1.6 "Leelawadee UI", "Noto Sans Thai", "Sarabun", system-ui, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: var(--muted); }
  a.btn { display: block; padding: 14px 16px; border-radius: 12px; background: var(--green); color: #fff; font-weight: 700; text-decoration: none; }
  small { display: block; margin-top: 16px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>ร้านย้ายหน้าเว็บไปที่ใหม่แล้ว</h1>
  <p id="msg">กำลังพาไปหน้าใหม่...</p>
  <a id="go" class="btn" href="https://pilot-shop.github.io/phokaew/">เปิดหน้าใหม่</a>
  <small>Betagro Shop โพธิ์แก้ว<br>ถ้ากดแล้วยังกลับมาหน้านี้ กรุณาแจ้งร้าน</small>
</main>
<script>
(function () {
  var NEW = 'https://pilot-shop.github.io/phokaew/', LIFF = 'https://miniapp.line.me/2011854466-g7l4isi8';
  var keep = {}, skip = /^(code|state|liffClientId|liffRedirectUri|liff\.state)$/;
  function take(q, d) { // เก็บพารามิเตอร์หน้าที่ตั้งใจเปิด (รวมที่ซ้อนอยู่ใน liff.state) ไม่เก็บค่าของการล็อกอิน LINE
    try { new URLSearchParams(String(q || '').replace(/^[^?]*\?/, '')).forEach(function (v, k) { if (k === 'liff.state' && d < 3) take(v, d + 1); else if (!skip.test(k) && !(k in keep)) keep[k] = v; }); } catch (e) { }
  }
  take(location.search, 0);
  var qs = Object.keys(keep).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(keep[k]); }).join('&');
  var inLine = /\bLine\//i.test(navigator.userAgent || '');
  var go = document.getElementById('go'), msg = document.getElementById('msg');
  if (inLine) { // ในแอป LINE: เปิดผ่านลิงก์ MINI App (ตาม Endpoint URL ที่ร้านตั้ง)
    go.href = LIFF + (qs ? '?' + qs : ''); go.textContent = 'เปิด MINI App ของร้าน';
    msg.textContent = 'กดปุ่มด้านล่าง หรือเปิดจากเมนูในแชต LINE ของร้านอีกครั้ง';
  } else {
    go.href = NEW + (qs ? '?' + qs : '');
    try { location.replace(go.href); } catch (e) { msg.textContent = 'กดปุ่มด้านล่างเพื่อเปิดหน้าใหม่'; }
  }
})();
</script>
</body>
</html>
